<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#351526"><meta name="description" content="Photograph a wine bottle and get a useful instant guide.">
  <link rel="manifest" href="/manifest.webmanifest?v=4"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css?v=4">
  <title>WineSnap</title>
</head>
<body>
  <div class="home-shell">
  <header><div class="mark">W</div><div><h1>WineSnap</h1><p>Snap the bottle. Know the wine.</p></div></header>
  <main>
    <section class="hero">
      <p class="eyebrow">YOUR POCKET WINE GUIDE</p>
      <h2>Know every<br>wine you drink.</h2>
      <p>Photograph the label for an instant, researched guide.</p>
    </section>
    <form id="scanForm">
      <label class="camera" for="photo">
        <img id="preview" alt="Selected wine bottle preview" hidden>
        <span id="cameraPrompt"><span class="camera-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 4.5 10.4 3h3.2L15 4.5h3A3 3 0 0 1 21 7.5v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3h3Zm3 3.25A4.75 4.75 0 1 0 12 17.25 4.75 4.75 0 0 0 12 7.75Zm0 2A2.75 2.75 0 1 1 12 15.25 2.75 2.75 0 0 1 12 9.75Z"/></svg></span><b>Take a wine photo</b><small>or choose one from your phone</small></span>
      </label>
      <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required>
      <button id="scanButton" type="submit">Identify this wine</button>
    </form>
    <section class="benefits" aria-label="WineSnap features"><div><strong>01</strong><span>Identify</span></div><div><strong>02</strong><span>Ratings</span></div><div><strong>03</strong><span>Reviews</span></div></section>
    <p id="status" role="status" aria-live="polite"></p>
    <article id="result" hidden></article>
  </main>
  </div>
  <footer>Wine details are guidance; check the bottle for definitive information.</footer>
  <script src="/app.js?v=4" type="module"></script>
</body>
</html>
